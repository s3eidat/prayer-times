<script type="application/ld+json">{"@context": "https://schema.org", "@type": "WebApplication", "name": "Prayer Times", "url": "https://s3eidat.github.io/prayer-times/", "description": "Accurate prayer times for your location. Free, private and runs 100% in your browser: no sign-up, no uploads.", "applicationCategory": "UtilitiesApplication", "operatingSystem": "Any (web browser)", "isAccessibleForFree": true, "offers": {"@type": "Offer", "price": "0", "priceCurrency": "USD"}, "image": "https://s3eidat.github.io/prayer-times/screenshot.png", "author": {"@type": "Person", "name": "s3eidat", "url": "https://github.com/s3eidat"}}</script>

<body data-tool="prayer-times">
<main class="s3-main" id="main">
  <section class="s3-hero no-print">
    <div class="row between">
      <h1 data-t="title">Prayer Times</h1>
      <div class="seg" id="lang" role="group" aria-label="Language / اللغة">
        <button aria-pressed="true" data-v="en">English</button>
        <button aria-pressed="false" data-v="ar">العربية</button>
      </div>
    </div>
    <p data-t="intro">Prayer times for your city or exact location, calculated on your device. Your location never leaves this page.</p>
  </section>

  <section class="card no-print">
    <div class="grid-3">
      <label class="field"><span data-t="city">City</span><select class="select" id="city"></select></label>
      <label class="field"><span data-t="method">Calculation method</span><select class="select" id="method"></select></label>
      <div class="field"><span data-t="asr">Asr</span>
        <div class="seg" id="madhab" role="group" aria-label="Asr">
          <button aria-pressed="true" data-v="shafi" data-t="shafi">Standard (Shafi'i, Maliki, Hanbali)</button>
          <button aria-pressed="false" data-v="hanafi" data-t="hanafi">Hanafi</button>
        </div>
      </div>
    </div>
    <div class="row mt loc-row">
      <button class="btn" id="geo"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="7"/></svg><span data-t="useLoc">Use my location</span></button>
      <label class="field small"><span data-t="lat">Latitude</span><input class="input" id="lat" type="number" step="0.0001" min="-90" max="90" inputmode="decimal"></label>
      <label class="field small"><span data-t="lon">Longitude</span><input class="input" id="lon" type="number" step="0.0001" min="-180" max="180" inputmode="decimal"></label>
      <label class="field grow"><span data-t="tz">Time zone</span><select class="select" id="tz"></select></label>
    </div>
  </section>

  <section class="card mt today-card">
    <div class="row between">
      <div>
        <h2 class="place" id="place"></h2>
        <div class="muted" id="dates"></div>
      </div>
      <div class="row no-print">
        <button class="btn small icon" id="prev" aria-label="Previous day">‹</button>
        <button class="btn small" id="today" data-t="today">Today</button>
        <button class="btn small icon" id="next" aria-label="Next day">›</button>
      </div>
    </div>
    <div class="next" id="nextBox">
      <span class="faint" data-t="nextPrayer">Next prayer</span>
      <b id="nextName">—</b>
      <span class="count mono" id="countdown">--:--:--</span>
    </div>
    <div class="times" id="times"></div>
    <p class="faint" id="methodNote"></p>
  </section>

  <section class="card mt" id="monthCard">
    <div class="row between">
      <h2><span data-t="monthly">Monthly timetable</span> <small id="monthTitle"></small></h2>
      <div class="row no-print">
        <label><span class="sr" data-t="month">Month</span><input class="input month" type="month" id="month"></label>
        <button class="btn small" id="csv"><svg class="i"><use href="#i-download"/></svg>CSV</button>
        <button class="btn small" id="print" data-t="print">Print</button>
      </div>
    </div>
    <div class="tbl-wrap mt"><table class="tbl month-tbl" id="table"></table></div>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
